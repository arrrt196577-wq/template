name: Go skeleton

on:
  push:
    paths:
      - backend-template/go/**
      - .github/workflows/go.yml
  pull_request:
    paths:
      - backend-template/go/**
      - .github/workflows/go.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-template/go
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: template_go_test
          POSTGRES_USER: template_go_test
          # Ephemeral CI service only; never reused as application configuration.
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U template_go_test -d template_go_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend-template/go/.go-version
          cache-dependency-path: backend-template/go/go.sum
      - name: Check, test, scan and build
        env:
          TEST_DATABASE_DSN: postgres://template_go_test:ci-disposable-password@localhost:5432/template_go_test?sslmode=disable
        run: sh scripts/check.sh --integration --security
